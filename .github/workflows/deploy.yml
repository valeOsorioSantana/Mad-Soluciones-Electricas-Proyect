name: Deploy

# Construye la imagen Docker y la publica en GitHub Container Registry al hacer push a main.
# El último paso (desplegar en tu servidor) está parametrizado con secretos: ver README.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Se ejecuta solo si configuraste los secretos DEPLOY_HOST, DEPLOY_USER y DEPLOY_SSH_KEY.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker rm -f mad-web || true
            docker run -d --name mad-web --restart unless-stopped -p 80:8080 \
              -e ALLOWED_HOSTS="${{ vars.ALLOWED_HOSTS }}" ${{ env.IMAGE }}:latest
