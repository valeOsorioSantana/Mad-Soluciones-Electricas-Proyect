name: Deploy

# Construye la imagen Docker y la publica en GitHub Container Registry.
# Solo se ejecuta a mano (Actions > Deploy > Run workflow): la demo temporal usa Render (ver render.yaml).
# Para producción con Docker, vuelve a agregar `push: branches: [main]` en `on:`.
# El último paso (desplegar en tu servidor) está parametrizado con secretos: ver README.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # Docker exige nombres en minúsculas; el repositorio puede tener mayúsculas.
      - name: Nombre de la imagen en minúsculas
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Se ejecuta solo si configuraste los secretos DEPLOY_HOST, DEPLOY_USER y DEPLOY_SSH_KEY.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ needs.build-and-push.outputs.image }}:latest
            docker rm -f mad-web || true
            docker run -d --name mad-web --restart unless-stopped -p 80:8080 \
              -e ALLOWED_HOSTS="${{ vars.ALLOWED_HOSTS }}" ${{ needs.build-and-push.outputs.image }}:latest
