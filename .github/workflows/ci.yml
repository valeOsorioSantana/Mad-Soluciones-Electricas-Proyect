name: CI

# Lo ejecuta deploy-cloudflare.yml en cada push a main y en cada pull request
# (así CI corre una sola vez y el despliegue solo ocurre si pasa).
# También se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
