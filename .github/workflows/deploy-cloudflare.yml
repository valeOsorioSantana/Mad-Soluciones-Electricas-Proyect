name: Deploy (Cloudflare Pages)

# main  -> producción.
# Pull request -> vista previa con URL propia (solo PRs del mismo repositorio, porque usan secretos).
# Solo se despliega si CI (lint, typecheck, tests, build) pasa.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Solo se despliega si:
    #  - ya configuraste la variable CLOUDFLARE_PROJECT_NAME (si no, se omite sin marcar error),
    #  - no es una PR de Dependabot (esas ejecuciones no reciben los secretos normales),
    #  - y, en PRs, la rama es de este mismo repositorio.
    if: >-
      vars.CLOUDFLARE_PROJECT_NAME != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # En main publica a producción; en un PR, a una vista previa con el nombre de la rama.
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
