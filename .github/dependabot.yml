version: 2
updates:
  # Dependencias npm: una sola PR semanal con las actualizaciones menores y de parche.
  # Los saltos de versión mayor se ignoran (se revisan a mano cuando se quiera migrar).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones de GitHub: todas agrupadas en una sola PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
